<path d="M431.72,382.92 Q440,394.88 448.28,382.92 Z" fill="#555" stroke="#222" stroke-width="1.104"/><path d="M433.56,383.84 L446.44,383.84" stroke="#fff" stroke-width="1.84"/><text x="50" y="370" font-size="22" text-anchor="middle" font-weight="bold" fill="#555" font-family="NanumGothic, 'Nanum Gothic', Gulim, sans-serif"><tspan x="50" dy="0">은메달</tspan></text><text x="552" y="370" font-size="22" text-anchor="middle" font-weight="bold" fill="#8a5a2b" font-family="NanumGothic, 'Nanum Gothic', Gulim, sans-serif"><tspan x="552" dy="0">동메달</tspan></text><rect x="12" y="10" width="576" height="147.84000000000003" fill="#ffffff" stroke="#222" stroke-width="2"/><text x="300.0" y="37.599999999999994" font-size="24" text-anchor="middle" font-weight="normal" fill="#111" font-family="NanumGothic, 'Nanum Gothic', Gulim, sans-serif"><tspan x="300.0" dy="0">은메달을 딴 선수는 '내가 실수만 하지</tspan><tspan x="300.0" dy="31.68">않았더라면 금메달을 딸 수 있었을 텐데.'</tspan><tspan x="300.0" dy="31.68">라고 생각하여 은메달을 딴 것에 실망하는</tspan><tspan x="300.0" dy="31.68">경우가 많았습니다.</tspan></text><rect x="12" y="168" width="576" height="147.84000000000003" fill="#ffffff" stroke="#222" stroke-width="2"/><text x="300.0" y="195.6" font-size="24" text-anchor="middle" font-weight="normal" fill="#111" font-family="NanumGothic, 'Nanum Gothic', Gulim, sans-serif"><tspan x="300.0" dy="0">한편 동메달을 딴 선수는 '내가 실수를</tspan><tspan x="300.0" dy="31.68">했더라면 메달을 못 딸 뻔했다.'라고 생각하여</tspan><tspan x="300.0" dy="31.68">동메달을 딴 것에 대단히 만족하는</tspan><tspan x="300.0" dy="31.68">경우가 많았답니다.</tspan></text></g><rect x="0" y="0" width="600" height="520" fill="none" stroke="#111" stroke-width="3"/></g></svg>